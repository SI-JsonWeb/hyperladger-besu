      --rpc-http-enabled
      --rpc-http-api=ETH,NET,QBFT,ADMIN,WEB3,EEA,PRIV
      --rpc-http-host=0.0.0.0
      --rpc-http-port=8545
      --rpc-http-cors-origins=all
      --host-allowlist=*
      --min-gas-price=0
      --tx-pool-min-gas-price=0
      --privacy-enabled
      --privacy-url=http://tessera3:9082
      --privacy-public-key-file=/opt/besu/keys/tessera3.pub
    networks:
      besu-network:
        ipv4_address: 172.20.0.4

  node4:
    image: hyperledger/besu:24.1.0
    container_name: besu-node4
    user: root
    depends_on:
      - node1
      - tessera4
    ports:
      - "8548:8545"
    volumes:
