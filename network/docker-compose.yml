  redis:
    image: redis:8-alpine
    container_name: besu-redis
    restart: unless-stopped
    ports:
      - "6379:6379"                 # expose to host for inspection
    volumes:
      - redis-data:/data            # persist data across restarts
    command: redis-server --appendonly yes  # enable AOF persistence
    networks:
      besu-network:
        ipv4_address: 172.20.0.7

  # ── BLOCK COLLECTOR ───────────────────────────────────────
  block-collector:
    build:
      context: ./collector
      dockerfile: Dockerfile
    container_name: besu-block-collector
    restart: unless-stopped
    depends_on:
      - node1
      - redis
    environment:
      - BESU_RPC_URL=http://172.20.0.2:8545
      - REDIS_URL=redis://redis:6379
      - POLL_INTERVAL_MS=2000        # match your blockperiodseconds
    networks:
      besu-network:
        ipv4_address: 172.20.0.8

volumes:
  node1-data:
  node2-data:
  node3-data:
  node4-data:
  node5-data:
  redis-data:
