---
- name: Health check all nodes
  hosts: all
  tasks:
    - name: Check node RPC
      uri:
        url: "http://localhost:{{ item.rpc_port }}"
        method: POST
        body_format: json
        body:
          jsonrpc: "2.0"
          method: "eth_blockNumber"
          params: []
          id: 1
        timeout: 5
      loop: "{{ nodes }}"
      register: health_results
      ignore_errors: true

    - name: Print block numbers
      debug:
        msg: "Node {{ item.item.name }}: {{ item.json.result | default('UNREACHABLE') }}"
      loop: "{{ health_results.results }}"