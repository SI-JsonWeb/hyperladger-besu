---
- name: Check DC1 health
  hosts: dc1
  gather_facts: false
  tasks:
    - name: Check dc1-node1 RPC
      uri:
        url: "http://localhost:8545"
        method: POST
        body_format: json
        body:
          jsonrpc: "2.0"
          method: "eth_blockNumber"
          params: []
          id: 1
        timeout: 5
      register: dc1_health
      ignore_errors: true

    - name: Check dc1-node2 RPC
      uri:
        url: "http://localhost:8546"
        method: POST
        body_format: json
        body:
          jsonrpc: "2.0"
          method: "eth_blockNumber"
          params: []
          id: 1
        timeout: 5
      register: dc1_node2_health
      ignore_errors: true

    - name: Set DC1 failed fact
      set_fact:
        dc1_failed: "{{ dc1_health.failed | bool or dc1_node2_health.failed | bool }}"

- name: Inspect DC2 archive standby mode
  hosts: dc2
  gather_facts: false
  tasks:
    - name: Check dc2-archive3 mode
      command: docker inspect -f "{{ '{{' }} index .Config.Labels \"besu.dr.mode\" {{ '}}' }}" besu-dc2-archive3
      register: archive3_mode
      failed_when: false
      changed_when: false

    - name: Check dc2-archive4 mode
      command: docker inspect -f "{{ '{{' }} index .Config.Labels \"besu.dr.mode\" {{ '}}' }}" besu-dc2-archive4
      register: archive4_mode
      failed_when: false
      changed_when: false

- name: Failover by promoting DC2 archive nodes
  hosts: dc2
  gather_facts: false
  vars:
    network_root: /home/webbacillus/10_projects/05_hyperladger_besu/hyperladger-besu/network
  tasks:
    - name: Stop DC1 validators before promoting archive nodes
      command: docker stop besu-dc1-node1 besu-dc1-node2
      failed_when: false
      when: hostvars['dc1-server']['dc1_failed'] | bool

    - name: Remove dc2-archive3 archive container before validator promotion
      command: docker rm -f besu-dc2-archive3
      failed_when: false
      when:
        - hostvars['dc1-server']['dc1_failed'] | bool
        - archive3_mode.stdout != 'validator'

    - name: Promote dc2-archive3 as validator using dc1-node1 key
      command: >
        docker run -d
        --name besu-dc2-archive3
        --label besu.dr.mode=validator
        --network besu-shared
        --ip 172.22.0.8
        --user root
        -p 8553:8545
        -v {{ network_root }}/dc1/dc1-node1/keys:/opt/besu/keys
        -v {{ network_root }}/dc2/genesis.json:/opt/besu/genesis.json
        -v {{ network_root }}/static-peers/dc2-archive3-validator/static-nodes.json:/opt/besu/static-nodes.json:ro
        -v dc2_dc2-archive3-data:/opt/besu/data
        hyperledger/besu:24.1.0
        --genesis-file=/opt/besu/genesis.json
        --node-private-key-file=/opt/besu/keys/key
        --data-path=/opt/besu/data
        --sync-mode=FULL
        --data-storage-format=FOREST
        --p2p-host=172.22.0.8
        --p2p-port=30303
        --static-nodes-file=/opt/besu/static-nodes.json
        --rpc-http-enabled
        --rpc-http-api=ETH,NET,QBFT,WEB3
        --rpc-http-host=0.0.0.0
        --rpc-http-port=8545
        --rpc-http-cors-origins=all
        --host-allowlist=*
        --min-gas-price=0
        --tx-pool-min-gas-price=0
      when:
        - hostvars['dc1-server']['dc1_failed'] | bool
        - archive3_mode.stdout != 'validator'

    - name: Remove dc2-archive4 archive container before validator promotion
      command: docker rm -f besu-dc2-archive4
      failed_when: false
      when:
        - hostvars['dc1-server']['dc1_failed'] | bool
        - archive4_mode.stdout != 'validator'

    - name: Promote dc2-archive4 as validator using dc1-node2 key
      command: >
        docker run -d
        --name besu-dc2-archive4
        --label besu.dr.mode=validator
        --network besu-shared
        --ip 172.22.0.9
        --user root
        -p 8554:8545
        -v {{ network_root }}/dc1/dc1-node2/keys:/opt/besu/keys
        -v {{ network_root }}/dc2/genesis.json:/opt/besu/genesis.json
        -v {{ network_root }}/static-peers/dc2-archive4-validator/static-nodes.json:/opt/besu/static-nodes.json:ro
        -v dc2_dc2-archive4-data:/opt/besu/data
        hyperledger/besu:24.1.0
        --genesis-file=/opt/besu/genesis.json
        --node-private-key-file=/opt/besu/keys/key
        --data-path=/opt/besu/data
        --sync-mode=FULL
        --data-storage-format=FOREST
        --p2p-host=172.22.0.9
        --p2p-port=30303
        --static-nodes-file=/opt/besu/static-nodes.json
        --rpc-http-enabled
        --rpc-http-api=ETH,NET,QBFT,WEB3
        --rpc-http-host=0.0.0.0
        --rpc-http-port=8545
        --rpc-http-cors-origins=all
        --host-allowlist=*
        --min-gas-price=0
        --tx-pool-min-gas-price=0
      when:
        - hostvars['dc1-server']['dc1_failed'] | bool
        - archive4_mode.stdout != 'validator'

    - name: Wait for promoted archive validator RPC endpoints
      uri:
        url: "http://localhost:{{ item }}"
        method: POST
        body_format: json
        body:
          jsonrpc: "2.0"
          method: "net_peerCount"
          params: []
          id: 1
        timeout: 5
      loop:
        - 8553
        - 8554
      register: promoted_rpc
      retries: 10
      delay: 3
      until: promoted_rpc is not failed
      when: hostvars['dc1-server']['dc1_failed'] | bool

    - name: Log archive validator failover event
      lineinfile:
        path: /tmp/besu-failover.log
        line: "{{ lookup('pipe', 'date --iso-8601=seconds') }} - DC1 failure detected, A3/A4 promoted as validators in DC2"
        create: true
      when:
        - hostvars['dc1-server']['dc1_failed'] | bool
        - archive3_mode.stdout != 'validator' or archive4_mode.stdout != 'validator'

- name: Failback by returning DC2 archive nodes to read-only mode
  hosts: dc2
  gather_facts: false
  vars:
    dc1_compose_dir: /home/webbacillus/10_projects/05_hyperladger_besu/hyperladger-besu/network/dc1
    dc2_compose_dir: /home/webbacillus/10_projects/05_hyperladger_besu/hyperladger-besu/network/dc2
  tasks:
    - name: Remove dc2-archive3 validator-mode container if DC1 is back
      command: docker rm -f besu-dc2-archive3
      failed_when: false
      when:
        - not hostvars['dc1-server']['dc1_failed'] | bool
        - archive3_mode.stdout == 'validator'

    - name: Remove dc2-archive4 validator-mode container if DC1 is back
      command: docker rm -f besu-dc2-archive4
      failed_when: false
      when:
        - not hostvars['dc1-server']['dc1_failed'] | bool
        - archive4_mode.stdout == 'validator'

    - name: Start DC1 validators after archive handback
      command: docker compose up -d dc1-node1 dc1-node2
      args:
        chdir: "{{ dc1_compose_dir }}"
      when:
        - not hostvars['dc1-server']['dc1_failed'] | bool
        - archive3_mode.stdout == 'validator' or archive4_mode.stdout == 'validator'

    - name: Restart DC2 archive nodes in read-only mode
      command: docker compose up -d dc2-archive3 dc2-archive4
      args:
        chdir: "{{ dc2_compose_dir }}"
      when:
        - not hostvars['dc1-server']['dc1_failed'] | bool
        - archive3_mode.stdout == 'validator' or archive4_mode.stdout == 'validator'

    - name: Wait for normal and archive RPC endpoints after handback
      uri:
        url: "http://localhost:{{ item }}"
        method: POST
        body_format: json
        body:
          jsonrpc: "2.0"
          method: "net_peerCount"
          params: []
          id: 1
        timeout: 5
      loop:
        - 8545
        - 8546
        - 8547
        - 8548
        - 8553
        - 8554
      register: handback_rpc
      retries: 12
      delay: 5
      until: handback_rpc is not failed
      when:
        - not hostvars['dc1-server']['dc1_failed'] | bool
        - archive3_mode.stdout == 'validator' or archive4_mode.stdout == 'validator'

    - name: Log DC1 recovery and archive handback
      lineinfile:
        path: /tmp/besu-failover.log
        line: "{{ lookup('pipe', 'date --iso-8601=seconds') }} - DC1 recovered, A3/A4 returned to archive mode"
        create: true
      when:
        - not hostvars['dc1-server']['dc1_failed'] | bool
        - archive3_mode.stdout == 'validator' or archive4_mode.stdout == 'validator'
