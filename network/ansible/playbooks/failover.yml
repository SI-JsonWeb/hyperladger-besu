---
- name: Check DC1 health
  hosts: dc1
  gather_facts: false
  tasks:
    - name: Check dc1-node1 RPC
      uri:
        url: "http://localhost:8545"
        method: POST
        body_format: json
        body:
          jsonrpc: "2.0"
          method: "eth_blockNumber"
          params: []
          id: 1
        timeout: 5
      register: dc1_health
      ignore_errors: true

    - name: Set DC1 failed fact
      set_fact:
        dc1_failed: "{{ dc1_health.failed | bool }}"

- name: Failover — spin recovery nodes in DC2
  hosts: dc2
  gather_facts: false
  tasks:
    - name: Check if recovery-node5 already running
      command: docker inspect besu-recovery-node5
      register: node5_exists
      ignore_errors: true

    - name: Deploy recovery node5 in DC2 (uses dc1-node1 keys)
      command: >
        docker run -d
        --name besu-recovery-node5
        --network besu-shared
        --ip 172.22.0.6
        --user root
        -p 8549:8545
        -p 30307:30303
        -v /mnt/d/OneDrive - National ITMX Company/Code/node-tolerant/network/dc1/dc1-node1/keys:/opt/besu/keys
        -v /mnt/d/OneDrive - National ITMX Company/Code/node-tolerant/network/dc2/genesis.json:/opt/besu/genesis.json
        hyperledger/besu:24.1.0
        --genesis-file=/opt/besu/genesis.json
        --node-private-key-file=/opt/besu/keys/key
        --data-path=/opt/besu/data
        --p2p-host=0.0.0.0
        --p2p-port=30303
        --bootnodes=enode://ca3ae5014ad6d31cba2338e07c05248752578e95d0efd7bd19b128c1fdb3c8b20544d53789826618391518ea88e71f6d9e64124a9350a8d833c43bc5e8bf89da@172.22.0.4:30303
        --rpc-http-enabled
        --rpc-http-api=ETH,NET,QBFT,ADMIN,WEB3
        --rpc-http-host=0.0.0.0
        --rpc-http-port=8545
        --rpc-http-cors-origins=all
        --host-allowlist=*
        --min-gas-price=0
        --tx-pool-min-gas-price=0
      when:
        - hostvars['dc1-server']['dc1_failed'] | bool
        - node5_exists.rc != 0

    - name: Check if recovery-node6 already running
      command: docker inspect besu-recovery-node6
      register: node6_exists
      ignore_errors: true

    - name: Deploy recovery node6 in DC2 (uses dc1-node2 keys)
      command: >
        docker run -d
        --name besu-recovery-node6
        --network besu-shared
        --ip 172.22.0.7
        --user root
        -p 8550:8545
        -p 30308:30303
        -v /mnt/d/OneDrive - National ITMX Company/Code/node-tolerant/network/dc1/dc1-node2/keys:/opt/besu/keys
        -v /mnt/d/OneDrive - National ITMX Company/Code/node-tolerant/network/dc2/genesis.json:/opt/besu/genesis.json
        hyperledger/besu:24.1.0
        --genesis-file=/opt/besu/genesis.json
        --node-private-key-file=/opt/besu/keys/key
        --data-path=/opt/besu/data
        --p2p-host=0.0.0.0
        --p2p-port=30303
        --bootnodes=enode://ca3ae5014ad6d31cba2338e07c05248752578e95d0efd7bd19b128c1fdb3c8b20544d53789826618391518ea88e71f6d9e64124a9350a8d833c43bc5e8bf89da@172.22.0.4:30303
        --rpc-http-enabled
        --rpc-http-api=ETH,NET,QBFT,ADMIN,WEB3
        --rpc-http-host=0.0.0.0
        --rpc-http-port=8545
        --rpc-http-cors-origins=all
        --host-allowlist=*
        --min-gas-price=0
        --tx-pool-min-gas-price=0
      when:
        - hostvars['dc1-server']['dc1_failed'] | bool
        - node6_exists.rc != 0

    - name: Log failover event
      lineinfile:
        path: /tmp/besu-failover.log
        line: "{{ lookup('pipe', 'date --iso-8601=seconds') }} - DC1 failure detected, recovery nodes started in DC2"
        create: true
      when: hostvars['dc1-server']['dc1_failed'] | bool

- name: Cleanup recovery nodes if DC1 recovered
  hosts: dc2
  gather_facts: false
  tasks:
    - name: Stop and remove recovery-node5 if DC1 is back
      command: docker rm -f besu-recovery-node5
      ignore_errors: true
      when: not hostvars['dc1-server']['dc1_failed'] | bool

    - name: Stop and remove recovery-node6 if DC1 is back
      command: docker rm -f besu-recovery-node6
      ignore_errors: true
      when: not hostvars['dc1-server']['dc1_failed'] | bool

    - name: Log DC1 recovery
      lineinfile:
        path: /tmp/besu-failover.log
        line: "{{ lookup('pipe', 'date --iso-8601=seconds') }} - DC1 recovered, recovery nodes removed from DC2"
        create: true
      when: not hostvars['dc1-server']['dc1_failed'] | bool