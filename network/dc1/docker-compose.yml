services:
  dc1-node1:
    image: hyperledger/besu:24.1.0
    container_name: besu-dc1-node1
    user: root
    ports:
      - "8545:8545"
      - "30303:30303"
    volumes:
      - ./dc1-node1/keys:/opt/besu/keys
      - ./genesis.json:/opt/besu/genesis.json
      - ../static-peers/dc1-node1/static-nodes.json:/opt/besu/static-nodes.json:ro
      - dc1-node1-data:/opt/besu/data
    command: >
      --genesis-file=/opt/besu/genesis.json
      --node-private-key-file=/opt/besu/keys/key
      --data-path=/opt/besu/data
      --p2p-host=172.22.0.2
      --p2p-port=30303
      --static-nodes-file=/opt/besu/static-nodes.json
      --rpc-http-enabled
      --rpc-http-api=ETH,NET,QBFT,WEB3
      --rpc-http-host=0.0.0.0
      --rpc-http-port=8545
      --rpc-http-cors-origins=all
      --host-allowlist=*
      --min-gas-price=0
      --tx-pool-min-gas-price=0
    networks:
      besu-internal:
        ipv4_address: 172.20.0.2
      besu-shared:
        ipv4_address: 172.22.0.2

  dc1-node2:
    image: hyperledger/besu:24.1.0
    container_name: besu-dc1-node2
    user: root
    depends_on:
      - dc1-node1
    ports:
      - "8546:8545"
    volumes:
      - ./dc1-node2/keys:/opt/besu/keys
      - ./genesis.json:/opt/besu/genesis.json
      - ../static-peers/dc1-node2/static-nodes.json:/opt/besu/static-nodes.json:ro
      - dc1-node2-data:/opt/besu/data
    command: >
      --genesis-file=/opt/besu/genesis.json
      --node-private-key-file=/opt/besu/keys/key
      --data-path=/opt/besu/data
      --p2p-host=172.22.0.3
      --p2p-port=30303
      --static-nodes-file=/opt/besu/static-nodes.json
      --rpc-http-enabled
      --rpc-http-api=ETH,NET,QBFT,WEB3
      --rpc-http-host=0.0.0.0
      --rpc-http-port=8545
      --rpc-http-cors-origins=all
      --host-allowlist=*
      --min-gas-price=0
      --tx-pool-min-gas-price=0
    networks:
      besu-internal:
        ipv4_address: 172.20.0.3
      besu-shared:
        ipv4_address: 172.22.0.3

volumes:
  dc1-node1-data:
  dc1-node2-data:

networks:
  besu-internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
  besu-shared:
    external: true
